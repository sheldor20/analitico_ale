name: Validate explicit periods
on:
  push:
    branches: [fix/periodos-explicitos-acumulado]
permissions:
  contents: write
concurrency:
  group: period-integration
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://portfolio-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-public-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Integrate shared period selector
        run: |
          if ! grep -q usePeriodSelection components/dashboard.tsx; then python3 scripts/refine-periods.py; fi
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/browser/playwright.config.mjs
      - name: Commit integrated source after every check passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components lib tests
          git diff --cached --quiet || git commit -m 'feat: integrate explicit quarters, semesters and calendar YTD'
          git push origin HEAD:fix/periodos-explicitos-acumulado
          git archive HEAD -o /tmp/validated-period-source.tar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: period-verification
          retention-days: 3
          path: |
            test-results
            playwright-report
            /tmp/validated-period-source.tar
