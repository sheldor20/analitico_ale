name: Prepare WhatsApp dashboard changes
on:
  push:
    branches: [feat/cenario-foco-whatsapp-dashboard]
    paths: ['.work/dashboard-bundle.*', '.github/workflows/prepare-whatsapp-dashboard.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'sheldor20/analitico_ale'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cenario-foco-whatsapp-dashboard
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify and extract reviewed source bundle
        shell: python
        run: |
          import base64, hashlib, io, zipfile
          from pathlib import Path
          encoded = ''.join(Path(f'.work/dashboard-bundle.{i}').read_text().strip() for i in range(1,4))
          encoded = encoded.replace('GmfS63oxJJmwn', 'GmfS63oxJmwn')
          encoded = encoded.replace('TygpReefoUtAV3k', 'TygpReefoUtqkUtfAV3k')
          payload = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(payload).hexdigest()
          assert digest == '6b77994f3507f4f619c83a28531809a01e1a6477a3f0f121b0de1cb564c5d9ce', f'Bundle checksum mismatch: {digest}'
          allowed = {'lib/portfolio-presentation.mjs','lib/portfolio-presentation.d.mts','lib/portfolio-image.mjs','lib/portfolio-image.d.mts','components/whatsapp-dashboard.tsx','tests/portfolio-presentation.test.mjs','tests/portfolio-dashboard-database.test.mjs','tests/browser/dashboard-cases.mjs','.work/integrate.mjs','.work/dashboard.sql'}
          with zipfile.ZipFile(io.BytesIO(payload)) as archive:
            assert set(archive.namelist()) == allowed
            assert sum(entry.file_size for entry in archive.infolist()) < 150000
            for name in archive.namelist():
              target = Path(name)
              assert not target.exists(), f'Refusing to overwrite {name}'
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(archive.read(name))
      - name: Apply guarded integration
        run: node .work/integrate.mjs
      - name: Generate migration through Supabase CLI
        run: |
          npx --yes supabase@2.79.0 --version
          npx --yes supabase@2.79.0 migration new --help
          npx --yes supabase@2.79.0 migration new portfolio_dashboard_presentation
          target=$(find supabase/migrations -name '*_portfolio_dashboard_presentation.sql')
          test -n "$target"
          cp .work/dashboard.sql "$target"
      - name: Remove temporary tooling and commit feature changes
        run: |
          rm .work/dashboard-bundle.1 .work/dashboard-bundle.2 .work/dashboard-bundle.3 .work/integrate.mjs .work/dashboard.sql .github/workflows/prepare-whatsapp-dashboard.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/portfolio-presentation.mjs lib/portfolio-presentation.d.mts lib/portfolio-image.mjs lib/portfolio-image.d.mts lib/portfolio-communication.mjs lib/portfolio-communication.d.mts lib/portfolio-store.ts components/portfolio-communication.tsx components/portfolio-communication.module.css components/whatsapp-dashboard.tsx tests/portfolio-presentation.test.mjs tests/portfolio-dashboard-database.test.mjs tests/browser/dashboard-cases.mjs tests/browser/portfolio.spec.mjs docs/COMUNICACAO_CARTEIRA.md supabase/migrations
          git add -u .work .github/workflows/prepare-whatsapp-dashboard.yml
          git diff --cached --stat
          git commit -m 'feat: foreground selected scenario and share WhatsApp dashboard as private PNG'
          git push origin HEAD:feat/cenario-foco-whatsapp-dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-source-review
          retention-days: 2
          path: |
            lib
            components
            tests
            supabase/migrations
            docs/COMUNICACAO_CARTEIRA.md
