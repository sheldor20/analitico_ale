name: Assemble portfolio integration
on:
  push:
    branches: [feat/comunicacao-carteira-outlook-whatsapp]
    paths: ['.work/*.mjs', '.github/workflows/assemble-portfolio.yml']
permissions:
  contents: write
jobs:
  assemble:
    if: github.repository == 'sheldor20/analitico_ale'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/comunicacao-carteira-outlook-whatsapp
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node .work/refine-portfolio.mjs
      - name: Commit only reviewed refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/portfolio-communication.mjs
          if ! git diff --cached --quiet; then
            git commit -m 'fix: fold email headers and validate unique recipients and phone area codes'
            git push origin HEAD:feat/comunicacao-carteira-outlook-whatsapp
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-source-review
          retention-days: 1
          path: |
            components
            lib
            supabase/migrations
            tests
            package.json
            package-lock.json
            tsconfig.json
            next.config.mjs
