name: Assemble scenario improvements
on:
  push:
    branches: [feat/comparativos-resumo-pa-modelos]
    paths: [scripts/assemble-scenarios.py, scripts/scenarios-schema.sql, .github/workflows/assemble-scenarios.yml]
permissions:
  contents: write
concurrency:
  group: assemble-scenario-improvements
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'sheldor20/analitico_ale'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://portfolio-test.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-public-test-key
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/comparativos-resumo-pa-modelos
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python3 scripts/assemble-scenarios.py
      - name: Generate migration with Supabase CLI
        run: |
          if ! ls supabase/migrations/*_scenario_message_defaults.sql >/dev/null 2>&1; then
            npx --yes supabase@2.81.3 --version
            npx --yes supabase@2.81.3 migration --help
            npx --yes supabase@2.81.3 migration new scenario_message_defaults
            cp scripts/scenarios-schema.sql $(ls supabase/migrations/*_scenario_message_defaults.sql)
          fi
      - name: Commit generated source only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add components lib tests supabase/migrations
          git diff --cached --quiet || git commit -m 'feat: integrate scenarios, history import and private message defaults'
          git push origin HEAD:feat/comparativos-resumo-pa-modelos
          git rev-parse HEAD
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm install --no-save --package-lock=false --no-audit --no-fund @playwright/test@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/browser/playwright.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scenarios-assembly-verification
          retention-days: 7
          path: |
            test-results
            playwright-report
