name: Prepare security dependency lock
on:
  pull_request:
    types: [opened, reopened]
permissions:
  contents: write
jobs:
  lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'security/mandatory-login-and-data-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/mandatory-login-and-data-isolation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Pin official helper without running package scripts
        run: npm install --package-lock-only --ignore-scripts --save-exact @supabase/ssr@latest
      - name: Commit only dependency manifests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m 'chore(security): pin Supabase SSR and reproducible lockfile'
          git push origin HEAD:security/mandatory-login-and-data-isolation
