name: Security audit
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Scan source and public artifacts without printing secrets
        run: node scripts/audit-source.mjs
      - name: Audit runtime dependency advisories
        run: npm audit --omit=dev --audit-level=moderate
      - name: Read-only production HTTP snapshot (not a deployment test)
        if: always()
        run: node scripts/audit-public-http.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-audit-evidence
          retention-days: 7
          path: production-http-audit.json
