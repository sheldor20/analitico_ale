name: UX workbench
on:
  push:
    branches: [ux/portal-design-system-login]
    paths: [.github/workflows/ux-workbench.yml]
permissions:
  contents: read
jobs:
  assemble:
    if: github.ref == 'refs/heads/ux/portal-design-system-login'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ux/portal-design-system-login
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Apply hash-verified edits to the reviewed security integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git merge --no-commit --no-ff 3424dff7381d3c3d2aab68a1742928f0d235575c
          python3 - <<'PY'
          import base64,gzip,hashlib,json,pathlib
          parts=[pathlib.Path(f'scripts/ux-edit-{i}.b64').read_text().strip() for i in range(1,5)]
          parts[0]=parts[0].replace('jELbiZaxTumFo','jELbiZkTumFo')
          raw=gzip.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='0ab30a41e63010337dd6f6a701b86dbef195858112fd33a8a5e74487e370eb3a','Payload checksum mismatch'
          root=pathlib.Path.cwd().resolve()
          for name,item in json.loads(raw).items():
            path=(root/name).resolve()
            assert path.is_relative_to(root) and '.git' not in path.parts
            old=path.read_text() if path.exists() else ''
            assert hashlib.sha256(old.encode()).hexdigest()==item['sha256'],f'Baseline differs: {name}'
            lines=old.splitlines(True)
            for start,end,replacement in reversed(item['edits']):
              lines[start:end]=replacement.splitlines(True)
            new=''.join(lines)
            assert hashlib.sha256(new.encode()).hexdigest()==item['newsha'],f'Output differs: {name}'
            path.parent.mkdir(parents=True,exist_ok=True)
            path.write_text(new)
          print('All 27 edited files match the reviewed source checksums.')
          PY
      - name: Generate migration in chronological order through the Supabase CLI
        run: |
          mkdir -p /tmp/ux-assembly
          VERSION=$(npm view supabase version)
          echo "Supabase CLI $VERSION" > /tmp/ux-assembly/assembly.txt
          npx --yes supabase@"$VERSION" --version
          npx --yes supabase@"$VERSION" migration new --help
          npx --yes supabase@"$VERSION" migration new portal_mandatory_sessions
          NEW=$(find supabase/migrations -name '*_portal_mandatory_sessions.sql')
          test -n "$NEW"
          cp supabase/migrations/20260910143358_mandatory_sessions.sql "$NEW"
          git rm supabase/migrations/20260910143358_mandatory_sessions.sql
          echo "$NEW" >> /tmp/ux-assembly/assembly.txt
          cp "$NEW" /tmp/ux-assembly/
      - name: Commit only functional changes and remove temporary assembly permissions
        run: |
          git rm .github/workflows/ux-workbench.yml scripts/ux-edit-1.b64 scripts/ux-edit-2.b64 scripts/ux-edit-3.b64 scripts/ux-edit-4.b64
          git add -A
          git diff --cached --check
          git commit -m 'feat: focused Sicoob dashboard, shared UI system and mandatory private sessions'
          git push origin HEAD:ux/portal-design-system-login
          git rev-parse HEAD >> /tmp/ux-assembly/assembly.txt
          git archive HEAD | gzip > /tmp/ux-assembly/source.tar.gz
      - name: Validate Node tests and TypeScript
        run: |
          npm ci --no-audit --no-fund
          set -o pipefail
          npm test 2>&1 | tee /tmp/ux-assembly/tests.txt
          npm run check 2>&1 | tee /tmp/ux-assembly/typescript.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-assembly-validation
          path: /tmp/ux-assembly
          retention-days: 2
