name: UX workbench
on:
  push:
    branches: [ux/portal-design-system-login]
    paths: [.github/workflows/ux-workbench.yml, scripts/ux-refactor.patch]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Integrate security in temporary worktree
        run: |
          git config user.name 'UX validation'
          git config user.email 'validation@users.noreply.github.com'
          git merge --no-commit --no-ff 3424dff7381d3c3d2aab68a1742928f0d235575c
          mkdir -p /tmp/ux-source
          git ls-files -z | tar --null -T - -czf /tmp/ux-source/integrated.tar.gz
          git diff --cached --binary HEAD > /tmp/ux-source/security-integration.patch
      - uses: actions/upload-artifact@v4
        with:
          name: ux-integrated-source
          path: /tmp/ux-source
          retention-days: 1
